name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Create Mock Model and Artifacts for CI
      run: |
        python -c '
        import os
        import json
        import lightgbm as lgb
        import pandas as pd

        os.makedirs("models", exist_ok=True)
        os.makedirs("data/processed", exist_ok=True)

        for name in ["card1_mean.json", "card1_std.json", "global_freq.json", "cat_mappings.json"]:
            with open(os.path.join("data/processed", name), "w") as f:
                json.dump({}, f)

        X = pd.DataFrame({"A": [1, 2], "B": [3, 4]})
        y = [0, 1]
        train_data = lgb.Dataset(X, label=y)
        model = lgb.train({}, train_data, num_boost_round=1)
        model.save_model("models/lgb_model.txt")
        print("Mock artifacts created successfully!")
        '
        
    - name: Run Pytest
      run: |
        pytest -v
